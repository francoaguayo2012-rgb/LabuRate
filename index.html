<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabuRate | El benchmark de sueldos de Argentina</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

    <style>
        /* ================= VARIABLES ================= */
        :root {
            --bg-main: #FFFFFF;
            --bg-card: #F5F5F0;
            --accent-primary: #FF4D00;
            --accent-primary-hover: #E64500;
            --accent-dark: #0A0A0A;
            --success: #00C853;
            --alert: #FF1744;
            --warning: #FFD600;
            --text-main: #0A0A0A;
            --text-muted: #666666;
            
            --font-title: 'Bebas Neue', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ================= RESET & BASICS ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-main);
            background-color: var(--bg-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .bebas {
            font-family: var(--font-title);
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            cursor: pointer;
            font-family: var(--font-body);
            border: none;
            outline: none;
            transition: var(--transition);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ================= NAVBAR ================= */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 16px 0;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            flex-direction: column;
        }

        .logo h1 {
            font-size: 2rem;
            color: var(--accent-primary);
            margin: 0;
        }

        .logo span {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--accent-primary);
        }

        .btn-login {
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
        }

        /* ================= HERO ================= */
        #hero {
            padding: 160px 0 80px;
            background: linear-gradient(135deg, var(--bg-main) 60%, var(--bg-card) 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .hero-title {
            font-size: clamp(4rem, 8vw, 6.5rem);
            color: var(--accent-dark);
            margin-bottom: 16px;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 600px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(255, 77, 0, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.2);
            transform: rotate(45deg) translateY(-100%);
            transition: var(--transition);
        }

        .btn-primary:hover {
            background: var(--accent-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 77, 0, 0.4);
        }

        .btn-primary:hover::after {
            transform: rotate(45deg) translateY(100%);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-dark);
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border: 2px solid var(--accent-dark);
            border-radius: 8px;
            margin-left: 16px;
        }

        .btn-secondary:hover {
            background: var(--accent-dark);
            color: white;
        }

        .hero-stats {
            margin-top: 60px;
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .stat-number {
            font-size: 4rem;
            color: var(--accent-primary);
        }

        .stat-label {
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* TICKER */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: var(--accent-dark);
            color: white;
            padding: 12px 0;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .ticker {
            display: flex;
            white-space: nowrap;
            animation: tickerAnim 40s linear infinite;
        }

        .ticker:hover {
            animation-play-state: paused;
        }

        .ticker-item {
            padding: 0 2rem;
            font-weight: 500;
            font-size: 1rem;
        }

        .ticker-item span.highlight {
            color: var(--accent-primary);
            font-weight: 700;
        }

        @keyframes tickerAnim {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ================= BENCHMARK PÚBLICO ================= */
        #benchmark {
            padding: 100px 0;
            background: var(--accent-dark);
            color: white;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        .section-subtitle {
            font-size: 1.2rem;
            color: #999;
        }

        .filters-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            background: rgba(255,255,255,0.05);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 40px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #aaa;
        }

        select {
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #1A1A1A;
            color: white;
            font-family: var(--font-body);
            font-size: 1rem;
            appearance: none;
            cursor: pointer;
            transition: var(--transition);
        }

        select:focus {
            border-color: var(--accent-primary);
            outline: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--bg-card);
            color: var(--accent-dark);
            padding: 32px;
            border-radius: 16px;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(255, 77, 0, 0.15);
        }

        .card.main-card {
            border: 2px solid var(--accent-primary);
            transform: scale(1.05);
        }
        
        .card.main-card:hover {
            transform: scale(1.05) translateY(-8px);
        }

        .card-label {
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .card-value {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 8px;
            color: var(--accent-dark);
        }

        .card.main-card .card-value {
            color: var(--accent-primary);
            font-size: 4.5rem;
        }

        .card-usd {
            font-size: 1rem;
            font-weight: 700;
            color: var(--success);
            background: rgba(0, 200, 83, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .distribution-bar {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            margin: 40px 0 20px;
            position: relative;
        }

        .dist-fill {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, #555, var(--accent-primary), #555);
            border-radius: 6px;
            left: 25%;
            width: 50%;
        }

        .dist-markers {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0 5%;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 24px;
            margin-top: 24px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px
